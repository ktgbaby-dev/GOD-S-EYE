<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="robots" content="noindex, nofollow">
  <title>GOD'S EYE</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/public/base.css">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="/dashboard" data-link>
        <svg class="mark brand-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M5 32C17 13 47 13 59 32C47 51 17 51 5 32Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <circle class="iris" cx="32" cy="32" r="11.5" fill="none" stroke-width="2.2"/>
          <circle class="groove" cx="32" cy="32" r="7" fill="none" stroke-width="1.2"/>
          <circle class="pupil" cx="32" cy="32" r="2.8"/>
        </svg>
        <span class="wordmark">God's Eye</span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="who">
          <span class="who-name mono">OG-WAN</span>
          <span class="eyebrow">Private access</span>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" data-action="logout">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a class="brand brand-compact" href="/dashboard" data-link aria-label="God's Eye home">
          <svg class="mark brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M5 32C17 13 47 13 59 32C47 51 17 51 5 32Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
            <circle class="iris" cx="32" cy="32" r="11.5" fill="none" stroke-width="2.4"/>
            <circle class="pupil" cx="32" cy="32" r="3"/>
          </svg>
          <span class="wordmark">God's Eye</span>
        </a>
        <form class="search" id="global-search" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <label class="sr-only" for="q">Search leads</label>
          <input id="q" name="q" type="search" placeholder="Search artists, handles, genres…" autocomplete="off" enterkeyhint="search">
          <kbd class="search-kbd mono" aria-hidden="true">/</kbd>
        </form>
        <div class="topbar-right">
          <span class="online mono" title="All systems responding"><i></i>System online</span>
          <button class="btn btn-primary btn-sm add-btn" type="button" data-action="add-lead">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Add lead</span>
          </button>
        </div>
      </header>
      <div id="demo-banner" class="demo-banner" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div id="sheet-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/app/js/app.js"></script>
</body>
</html>
