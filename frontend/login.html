<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="robots" content="noindex, nofollow">
  <title>GOD'S EYE · Private access</title>
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="/shared/login.css">
</head>
<body>
  <main class="gate">
    <div class="gate-glow" aria-hidden="true"></div>
    <section class="gate-card" aria-labelledby="gate-title">
      <svg class="mark gate-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M5 32C17 13 47 13 59 32C47 51 17 51 5 32Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <circle class="iris" cx="32" cy="32" r="11.5" fill="none" stroke-width="1.4"/>
        <circle class="groove" cx="32" cy="32" r="8.5" fill="none" stroke-width="0.8"/>
        <circle class="groove" cx="32" cy="32" r="5.6" fill="none" stroke-width="0.8"/>
        <circle class="pupil" cx="32" cy="32" r="2.4"/>
      </svg>
      <h1 id="gate-title" class="wordmark gate-wordmark">God's Eye</h1>
      <p class="eyebrow gate-eyebrow">Private access</p>
      <p class="gate-lede serif">Client discovery intelligence for OG-WAN.</p>

      <form id="login" class="gate-form" novalidate>
        <label class="sr-only" for="password">Password</label>
        <input id="password" class="input gate-input" type="password" name="password" autocomplete="current-password"
               placeholder="Password" required autofocus>
        <button id="submit" class="btn btn-primary btn-lg gate-submit" type="submit">Enter God's Eye</button>
        <p id="msg" class="gate-msg" role="alert" aria-live="assertive"></p>
      </form>
    </section>
    <footer class="gate-foot eyebrow">Authorized access only.</footer>
  </main>
  <script type="module" src="/shared/login.js"></script>
</body>
</html>
